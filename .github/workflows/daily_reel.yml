name: Salesforce Reel (manual)

# Carousel is the default daily format (see daily_post.yml).
# This Reel workflow is kept for manual use only — trigger it from the
# Actions tab when you want to post a specific tip as a Reel instead.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate tip, cards, and reel
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUILD_REEL: "1"
        run: python daily_post.py

      - name: Commit generated files
        run: |
          git config user.name "sf-tips-bot"
          git config user.email "sf-tips-bot@users.noreply.github.com"
          git add output/reel.mp4 output/*.png data/current_tip.json data/recent_titles.json data/category_state.json data/run_meta.json
          git commit -m "Auto: daily Salesforce reel $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Publish Reel to Instagram
        working-directory: scripts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_reel_to_instagram.py
